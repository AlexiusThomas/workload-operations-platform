# WOP CI pipeline - GitHub Actions reference implementation (Task 21.1).
#
# Mirrors ci/pipeline.yml (the pipeline-agnostic source of truth). When the approved
# internal CI/CD tool is selected (DEP-005 - INTERNAL-INTEGRATION-TODO), translate these
# jobs into that tool. This workflow performs VALIDATION ONLY and never deploys to AWS and
# never requires real AWS credentials.
#
# Requirements traceability: NFR-005 AC-5 (automated tests + coverage gate),
# NFR-006 AC-3, NFR-007 AC-2 (env-agnostic config), NFR-008 AC-1/AC-2.

name: wop-ci

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

# Least privilege: read-only checkout; no deploy permissions.
permissions:
  contents: read

# No AWS credentials are configured. moto mocks DynamoDB/S3; cdk synth is deploy-free.
# Dummy region/creds keep boto3/CDK happy for in-memory synth without real access.
env:
  PYTHON_VERSION: "3.11"
  NODE_VERSION: "22"          # supported LTS required by jsii/CDK; never 24.x
  AWS_DEFAULT_REGION: "us-east-1"
  AWS_REGION: "us-east-1"
  ENVIRONMENT: "test"
  AUTH_MODE: "synthetic"

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Install dependencies (reproducible)
        run: pip install -r requirements.txt
      - name: Black (format check)
        run: black --check backend infra tests
      - name: Flake8
        run: flake8 backend infra tests
      - name: mypy
        run: mypy backend infra
      - name: Frontend lint (conditional on frontend/package.json)
        run: |
          if [ -f frontend/package.json ]; then
            npm ci --prefix frontend
            npm run --prefix frontend lint
          else
            echo "No frontend/package.json; skipping frontend lint."
          fi

  # Full backend suite with the 80% coverage gate measured against the COMPLETE backend
  # test set (unit + property + integration + concurrency + e2e) in a single job, so the
  # gate reflects real backend coverage and no backend tests run twice (NFR-005 AC-1/AC-5).
  backend_tests:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - name: Install dependencies (reproducible)
        run: pip install -r requirements.txt
      - name: Backend tests + 80% coverage gate (NFR-005 AC-1)
        run: >-
          pytest tests/unit tests/property tests/integration tests/concurrency tests/e2e
          --cov=backend --cov-report=term-missing --cov-fail-under=80

  infra_tests:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}     # jsii/CDK toolchain (LTS)
      - name: Install dependencies (reproducible)
        run: pip install -r requirements.txt
      - name: CDK synth / assertion tests (deploy-free, Task 20)
        run: pytest tests/infra

  build:
    runs-on: ubuntu-latest
    needs: [backend_tests, infra_tests]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Install dependencies (reproducible)
        run: |
          pip install -r requirements.txt
          pip install build
      - name: Build Lambda source package (environment-agnostic artifact)
        run: python -m build --sdist --wheel --outdir dist_artifacts
      - name: CDK synth (deploy-free) - validates CloudFormation output
        run: python -m infra.app
      - name: Frontend build (conditional on frontend/package.json)
        run: |
          if [ -f frontend/package.json ]; then
            npm ci --prefix frontend
            npm run --prefix frontend build
          else
            echo "No frontend/package.json; skipping frontend build."
          fi
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: wop-lambda-dist
          path: dist_artifacts/
          if-no-files-found: warn

  frontend_tests:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Frontend typecheck + tests (conditional on frontend/package.json)
        run: |
          if [ -f frontend/package.json ]; then
            npm ci --prefix frontend
            npm run --prefix frontend typecheck
            npm run --prefix frontend test
          else
            echo "No frontend/package.json; skipping frontend tests."
          fi
